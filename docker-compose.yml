services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: track-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      # Database (for PostgreSQL)
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-track_app}
      - DB_USERNAME=${DB_USERNAME:-track_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      - db
    networks:
      - track-network

  db:
    image: postgres:16-alpine
    container_name: track-app-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-track_app}
      - POSTGRES_USER=${DB_USERNAME:-track_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - track-network

  # For local MySQL instead of PostgreSQL, uncomment this:
  # db:
  #   image: mysql:8.0
  #   container_name: track-app-db
  #   restart: unless-stopped
  #   environment:
  #     - MYSQL_DATABASE=${DB_DATABASE:-track_app}
  #     - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
  #     - MYSQL_USER=${DB_USERNAME:-track_user}
  #     - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
  #   volumes:
  #     - db-data:/var/lib/mysql
  #   ports:
  #     - "3306:3306"
  #   networks:
  #     - track-network

volumes:
  db-data:
    driver: local

networks:
  track-network:
    driver: bridge
