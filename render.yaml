services:
  # Web Service (Docker)
  - type: web
    name: track-app
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://track-app.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      # Database (from Render PostgreSQL service)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: track-app-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        fromDatabase:
          name: track-app-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: track-app-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: track-app-db
          property: password
      - key: LOG_CHANNEL
        value: errorlog
      - key: LOG_LEVEL
        value: error
    disk:
      name: storage
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1

  # PostgreSQL Database
  - type: pserv
    name: track-app-db
    env: docker
    image: postgres:16-alpine
    region: singapore
    plan: free
    databases:
      - database: track_app
        user: track_user
